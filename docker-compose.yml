services:
  coulson-assistant:
    build: .
    container_name: coulson-assistant
    ports:
      - "8080:8080"
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL:-http://n8n:5678/webhook-test/transcribe}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-80797061-413c-47cf-a60c-bcc43a23d703}
      - WEBHOOK_CONNECT_TIMEOUT=${WEBHOOK_CONNECT_TIMEOUT:-30}
      - WEBHOOK_READ_TIMEOUT=${WEBHOOK_READ_TIMEOUT:-300}
      - VIDEO_MAX_CHUNK_SIZE_MB=${VIDEO_MAX_CHUNK_SIZE_MB:-200}
      - VIDEO_TEMP_DIR=/tmp/coulson-videos
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - FFPROBE_PATH=/usr/bin/ffprobe
    volumes:
      - coulson-temp:/tmp/coulson-videos
    networks:
      - yellowleaf-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  coulson-temp:

networks:
  yellowleaf-net:
    external: true
