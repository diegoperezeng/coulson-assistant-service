services:
  coulson-assistant:
    build: .
    container_name: coulson-assistant
    ports:
      - "8080:8080"
    environment:
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL:-http://n8n:5678}
      - WEBHOOK_TRANSCRIBE_PATH=${WEBHOOK_TRANSCRIBE_PATH:-/webhook/transcribe}
      - WEBHOOK_SPEAKERS_PATH=${WEBHOOK_SPEAKERS_PATH:-/webhook/speakers}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-80797061-413c-47cf-a60c-bcc43a23d703}
      - WEBHOOK_CONNECT_TIMEOUT=${WEBHOOK_CONNECT_TIMEOUT:-30}
      - WEBHOOK_READ_TIMEOUT=${WEBHOOK_READ_TIMEOUT:-300}
      - WEBHOOK_TRANSCRIPTION_PARALLELISM=${WEBHOOK_TRANSCRIPTION_PARALLELISM:-8}
      - VIDEO_MAX_CHUNK_SIZE_MB=${VIDEO_MAX_CHUNK_SIZE_MB:-200}
      - VIDEO_MAX_AUDIO_CHUNK_SECONDS=${VIDEO_MAX_AUDIO_CHUNK_SECONDS:-400}
      - VIDEO_TEMP_DIR=/tmp/coulson-videos
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - FFPROBE_PATH=/usr/bin/ffprobe
      - FFMPEG_AUDIO_SAMPLE_RATE=${FFMPEG_AUDIO_SAMPLE_RATE:-16000}
      - FFMPEG_AUDIO_CHANNELS=${FFMPEG_AUDIO_CHANNELS:-1}
      - FFMPEG_AUDIO_BITRATE=${FFMPEG_AUDIO_BITRATE:-32k}
    volumes:
      - coulson-temp:/tmp/coulson-videos
    networks:
      - yellowleaf-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  coulson-temp:

networks:
  yellowleaf-net:
    external: true
