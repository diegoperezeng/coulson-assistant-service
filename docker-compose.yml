services:
  coulson-assistant-service:
    build: .
    container_name: coulson-assistant-service
    environment:
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL:-http://n8n:5678}
      - WEBHOOK_TRANSCRIBE_PATH=${WEBHOOK_TRANSCRIBE_PATH:-/webhook/transcribe}
      - WEBHOOK_SPEAKERS_PATH=${WEBHOOK_SPEAKERS_PATH:-/webhook/speakers}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-80797061-413c-47cf-a60c-bcc43a23d703}
      - WEBHOOK_CONNECT_TIMEOUT=${WEBHOOK_CONNECT_TIMEOUT:-30}
      - WEBHOOK_READ_TIMEOUT=${WEBHOOK_READ_TIMEOUT:-300}
      - WEBHOOK_TRANSCRIPTION_PARALLELISM=${WEBHOOK_TRANSCRIPTION_PARALLELISM:-8}
      - VIDEO_MAX_CHUNK_SIZE_MB=${VIDEO_MAX_CHUNK_SIZE_MB:-200}
      - VIDEO_MAX_AUDIO_CHUNK_SECONDS=${VIDEO_MAX_AUDIO_CHUNK_SECONDS:-400}
      - VIDEO_TEMP_DIR=/tmp/coulson-videos
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - FFPROBE_PATH=/usr/bin/ffprobe
      - FFMPEG_AUDIO_SAMPLE_RATE=${FFMPEG_AUDIO_SAMPLE_RATE:-16000}
      - FFMPEG_AUDIO_CHANNELS=${FFMPEG_AUDIO_CHANNELS:-1}
      - FFMPEG_AUDIO_BITRATE=${FFMPEG_AUDIO_BITRATE:-32k}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER:-postgres}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-meetings}
      - SUPABASE_STORAGE_ACCESS_KEY=${SUPABASE_STORAGE_ACCESS_KEY}
      - SUPABASE_STORAGE_SECRET_KEY=${SUPABASE_STORAGE_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBEDDING_ENABLED=${OPENAI_EMBEDDING_ENABLED:-false}
      - SUPABASE_VOICE_SAMPLES_BUCKET=${SUPABASE_VOICE_SAMPLES_BUCKET:-voice-samples}
      - VIDEO_PERSIST_ENABLED=${VIDEO_PERSIST_ENABLED:-false}
      - VIDEO_PERSIST_BUCKET=${VIDEO_PERSIST_BUCKET:-videos}
      - VIDEO_PERSIST_PUBLIC_BUCKET=${VIDEO_PERSIST_PUBLIC_BUCKET:-true}
      - VIDEO_PERSIST_MAX_HEIGHT=${VIDEO_PERSIST_MAX_HEIGHT:-540}
      - VIDEO_PERSIST_TARGET_FPS=${VIDEO_PERSIST_TARGET_FPS:-30}
      - VIDEO_PERSIST_CRF=${VIDEO_PERSIST_CRF:-23}
      - VIDEO_PERSIST_PRESET=${VIDEO_PERSIST_PRESET:-veryfast}
      - VIDEO_PERSIST_AUDIO_BITRATE=${VIDEO_PERSIST_AUDIO_BITRATE:-96k}
      - VIDEO_PERSIST_ASYNC_POOL_SIZE=${VIDEO_PERSIST_ASYNC_POOL_SIZE:-2}
      - VIDEO_PERSIST_PROCESS_TIMEOUT=${VIDEO_PERSIST_PROCESS_TIMEOUT:-1800}
      - VIDEO_PERSIST_SIGNED_URL_EXPIRE=${VIDEO_PERSIST_SIGNED_URL_EXPIRE:-3600}
      - VIDEO_PERSIST_HLS_ENABLED=${VIDEO_PERSIST_HLS_ENABLED:-false}
      - SWAGGER_EXTERNAL_URL=${SWAGGER_EXTERNAL_URL:-}
      - SWAGGER_API_DOCS_URL=${SWAGGER_API_DOCS_URL:-/api-docs}
      - SWAGGER_CONFIG_URL=${SWAGGER_CONFIG_URL:-/api-docs/swagger-config}
    volumes:
      - coulson-temp:/tmp/coulson-videos
    networks:
      - yellowleaf-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  coulson-temp:

networks:
  yellowleaf-net:
    external: true
