name: n8n
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    expose:
      - "5678"
    environment:
      - N8N_FORMDATA_FILE_SIZE_MAX=1024
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=delavega
      - N8N_BASIC_AUTH_PASSWORD=Adivinha@123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - NODES_EXCLUDE=[]
      - TZ=America/Sao_Paulo
      - N8N_RESTRICT_FILE_ACCESS_TO=/tmp
      - NODE_ENV=production
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - N8N_PAYLOAD_SIZE_MAX=33554432
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8ndb
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=zMkjWl3ufg1r5UKqypCO
      - N8N_RUNNERS_ENABLED=true
      - EXECUTIONS_MODE=queue
    depends_on:
      - redis
      - postgres
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./local-files:/files
    networks:
      - yellowleaf-net

  redis:
    image: redis:6
    container_name: redis
    restart: always
    volumes:
      - ~/redis-data:/data
    networks:
      - yellowleaf-net

  postgres:
    image: postgres:15
    container_name: n8n-postgres
    restart: always
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: zMkjWl3ufg1r5UKqypCO
      POSTGRES_DB: n8ndb
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - yellowleaf-net
  n8n-worker:
    image: n8nio/n8n
    restart: always
    command: worker
    depends_on:
      - redis
      - postgres
      - n8n
    environment:
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8ndb
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=zMkjWl3ufg1r5UKqypCO
      - N8N_ENCRYPTION_KEY=LbuJVK8gvlqX6gVIacyeuk7efOvKUhlo
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./local-files:/files
    networks:
      - yellowleaf-net
    deploy:
      replicas: 6

volumes:
  n8n_data:
    external: true

networks:
  yellowleaf-net:
    external: true
