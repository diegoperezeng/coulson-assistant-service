server:
  port: 8080

spring:
  application:
    name: coulson-assistant
  servlet:
    multipart:
      max-file-size: 4GB
      max-request-size: 4GB
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        enabled: ${OPENAI_EMBEDDING_ENABLED:false}
        options:
          model: text-embedding-3-small

webhook:
  base-url: ${WEBHOOK_BASE_URL:http://n8n:5678}
  transcribe-path: ${WEBHOOK_TRANSCRIBE_PATH:/webhook/transcribe}
  speakers-path: ${WEBHOOK_SPEAKERS_PATH:/webhook/speakers}
  token: ${WEBHOOK_TOKEN:80797061-413c-47cf-a60c-bcc43a23d703}
  connect-timeout-seconds: ${WEBHOOK_CONNECT_TIMEOUT:30}
  read-timeout-seconds: ${WEBHOOK_READ_TIMEOUT:300}
  transcription-parallelism: ${WEBHOOK_TRANSCRIPTION_PARALLELISM:4}

video:
  max-chunk-size-mb: ${VIDEO_MAX_CHUNK_SIZE_MB:200}
  max-audio-chunk-seconds: ${VIDEO_MAX_AUDIO_CHUNK_SECONDS:400}
  temp-dir: ${VIDEO_TEMP_DIR:/tmp/coulson-videos}

ffmpeg:
  path: ${FFMPEG_PATH:/usr/bin/ffmpeg}
  ffprobe-path: ${FFPROBE_PATH:/usr/bin/ffprobe}
  audio-sample-rate: ${FFMPEG_AUDIO_SAMPLE_RATE:16000}
  audio-channels: ${FFMPEG_AUDIO_CHANNELS:1}
  audio-bitrate: ${FFMPEG_AUDIO_BITRATE:32k}

supabase:
  url: ${SUPABASE_URL:http://supabase-kong:8000}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  storage:
    voice-samples-bucket: ${SUPABASE_VOICE_SAMPLES_BUCKET:voice-samples}

swagger:
  external-url: ${SWAGGER_EXTERNAL_URL:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    url: ${SWAGGER_API_DOCS_URL:/api-docs}
    config-url: ${SWAGGER_CONFIG_URL:/api-docs/swagger-config}
    oauth2-redirect-url: ${SWAGGER_EXTERNAL_URL:}/swagger-ui/oauth2-redirect.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.yellowleaf.coulson: INFO
